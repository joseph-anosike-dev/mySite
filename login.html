<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS RESTRICTED</title>
<style>
  :root{
    --black: #0A0A0A;        /* 70% */
    --offwhite: #EAEAEA;     /* 20% */
    --accent: #FF2E2E;       /* 10% */
    --glass: rgba(234,234,234,0.04);
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    background: var(--black);
    color: var(--offwhite);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated grid background - "new world" vibe */
  body::before{
    content: '';
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(rgba(255,46,46,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,46,46,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: drift 20s linear infinite;
    opacity: 0.4;
  }
  @keyframes drift{
    0%{transform: translate(0,0)}
    100%{transform: translate(40px,40px)}
  }

  /* Radial glow */
  body::after{
    content: '';
    position: absolute;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(255,46,46,0.15) 0%, transparent 60%);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    filter: blur(80px);
    pointer-events: none;
  }

  .vault{
    position: relative;
    z-index: 2;
    width: min(90vw, 420px);
    padding: 48px 32px;
    background: var(--glass);
    border: 1px solid rgba(234,234,234,0.1);
    border-radius: 20px;
    backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 0 0 1px rgba(255,46,46,0.1), 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
    animation: floatIn 0.8s cubic-bezier(.16,1,.3,1);
  }
  @keyframes floatIn{
    from{opacity:0; transform: translateY(20px) scale(0.98)}
    to{opacity:1; transform: translateY(0) scale(1)}
  }

  .badge{
    display: inline-block;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 6px 12px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  h2{
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  p{
    color: rgba(234,234,234,0.7);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .input-wrap{
    position: relative;
    margin-bottom: 16px;
  }

  input{
    width: 100%;
    padding: 14px 16px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(234,234,234,0.15);
    border-radius: 12px;
    color: var(--offwhite);
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
  }
  input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,46,46,0.15);
  }
  input::placeholder{color: rgba(234,234,234,0.4)}

  button{
    width: 100%;
    padding: 14px 16px;
    background: var(--accent);
    color: var(--black);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  button:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,46,46,0.3);
  }
  button:active{transform: translateY(0)}

  #error{
    color: var(--accent);
    font-size: 13px;
    height: 20px;
    margin-top: 12px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #error.show{opacity: 1}

  /* Red flash on fail */
  @keyframes flashRed{
    0%,100%{background: var(--black)}
    50%{background: rgba(255,46,46,0.1)}
  }
  .flash{animation: flashRed 0.4s ease}

  .footer{
    margin-top: 24px;
    font-size: 11px;
    color: rgba(234,234,234,0.4);
  }
</style>
</head>
<body id="body">

<div class="vault">
  <span class="badge">Classified</span>
  <h2>Restricted Access</h2>
  <p>Enter credentials to view proprietary strategy + implementation assets</p>
  
  <div class="input-wrap">
    <input id="pw" type="password" placeholder="Authorization Key" autocomplete="off">
  </div>
  
  <button onclick="check()">Unlock Sector</button>
  
  <div id="error"></div>
  
  <div class="footer">Unauthorized access will be logged</div>
</div>

<script>
function check(){
  const err = document.getElementById('error');
  const body = document.getElementById('body');
  
  // Shake + red flash
  body.classList.add('flash');
  setTimeout(()=>body.classList.remove('flash'), 400);
  
  err.innerText = "Wrong password. Unauthorized.";
  err.classList.add('show');
  
  // Clear input with typewriter delete effect
  const input = document.getElementById('pw');
  let val = input.value;
  let i = val.length;
  const del = setInterval(()=>{
    input.value = val.slice(0, i--);
    if(i < 0){ clearInterval(del) }
  }, 30);
  
  // Kick back to main site
  setTimeout(()=>{ 
    window.location.href = "/index.html"; 
  }, 1400);
}

// Enter key support
document.getElementById('pw').addEventListener('keypress', e => {
  if(e.key === 'Enter') check();
})
</script>

</body>
</html>
